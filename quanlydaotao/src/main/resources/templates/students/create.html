<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
  <head>
    <meta charset="utf-8" />
    <title>Thêm mới sinh viên</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css"
    />
  </head>
  <body class="hold-transition sidebar-mini">
    <div class="wrapper">
      <nav class="main-header navbar navbar-expand navbar-white navbar-light">
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link" data-widget="pushmenu" href="#" role="button"
              ><i class="fas fa-bars"></i
            ></a>
          </li>
          <li class="nav-item d-none d-sm-inline-block">
            <a href="/students" class="nav-link">Trang chủ</a>
          </li>
        </ul>
      </nav>

      <aside class="main-sidebar sidebar-dark-primary elevation-4">
        <a href="/students" class="brand-link text-center">
          <span class="brand-text font-weight-light font-weight-bold"
            >QL ĐÀO TẠO</span
          >
        </a>
        <div class="sidebar">
          <nav class="mt-2">
            <ul
              class="nav nav-pills nav-sidebar flex-column"
              data-widget="treeview"
              role="menu"
            >
              <li class="nav-item">
                <a href="/students" class="nav-link active">
                  <i class="nav-icon fas fa-user-graduate"></i>
                  <p>Quản lý sinh viên</p>
                </a>
              </li>
            </ul>
          </nav>
        </div>
      </aside>

      <div class="content-wrapper p-4">
        <div class="card card-success">
          <div class="card-header">
            <h3 class="card-title">Thêm sinh viên mới</h3>
          </div>
          <form
            th:action="@{/students/create}"
            th:object="${student}"
            method="post"
          >
            <div class="card-body">
              <div class="form-group">
                <label>Mã sinh viên</label>
                <input
                  type="text"
                  th:field="*{studentCode}"
                  class="form-control"
                  required
                  placeholder="Nhập mã SV"
                />
              </div>
              <div class="form-group">
                <label>Họ và tên</label>
                <input
                  type="text"
                  th:field="*{fullName}"
                  class="form-control"
                  required
                  placeholder="Nhập họ và tên"
                />
              </div>
              <div class="form-group">
                <label>Email</label>
                <input
                  type="email"
                  th:field="*{email}"
                  class="form-control"
                  placeholder="Nhập email"
                />
              </div>
              <div class="form-group">
                <label>Số điện thoại</label>
                <input
                  type="text"
                  th:field="*{phone}"
                  class="form-control"
                  placeholder="Nhập số điện thoại"
                />
              </div>
              <div class="form-group">
                <label>Lớp</label>
                <input
                  type="text"
                  th:field="*{className}"
                  class="form-control"
                  placeholder="Nhập tên lớp"
                />
              </div>
            </div>
            <div class="card-footer">
              <button type="submit" class="btn btn-primary">
                <i class="fas fa-save"></i> Lưu thông tin
              </button>
              <a href="/students" class="btn btn-secondary"
                ><i class="fas fa-arrow-left"></i> Quay lại</a
              >
            </div>
          </form>
        </div>
      </div>

      <footer class="main-footer text-center">
        <strong>Hệ thống Quản lý Đào tạo</strong>
      </footer>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/js/adminlte.min.js"></script>
  </body>
</html>
