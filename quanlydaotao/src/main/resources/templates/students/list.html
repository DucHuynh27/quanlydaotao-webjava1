<!doctype html>

<html xmlns:th="http://www.thymeleaf.org" lang="vi">
  <head>
    <meta charset="utf-8" />
    <title>Quản lý Đào tạo | Danh sách sinh viên</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css"
    />
    <style>
      body, *:not(i):not([class*="fa"]) { font-family: 'Montserrat', sans-serif !important; }
    </style>
  </head>
  <body class="hold-transition sidebar-mini">
    <div class="wrapper">
      <!-- Navbar -->
      <nav class="main-header navbar navbar-expand navbar-white navbar-light">
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link" data-widget="pushmenu" href="#" role="button"
              ><i class="fas fa-bars"></i
            ></a>
          </li>
          <li class="nav-item d-none d-sm-inline-block">
            <a href="/students" class="nav-link">Trang chủ</a>
          </li>
        </ul>
      </nav>

      <!-- Sidebar -->
      <aside class="main-sidebar sidebar-dark-primary elevation-4">
        <a href="/students" class="brand-link text-center">
          <span class="brand-text font-weight-light font-weight-bold"
            >QL ĐÀO TẠO</span
          >
        </a>
        <div class="sidebar">
          <nav class="mt-2">
            <ul
              class="nav nav-pills nav-sidebar flex-column"
              data-widget="treeview"
              role="menu"
            >
              <li class="nav-item">
                <a href="/students" class="nav-link active">
                  <i class="nav-icon fas fa-user-graduate"></i>
                  <p>Quản lý sinh viên</p>
                </a>
              </li>
            </ul>
          </nav>
        </div>
      </aside>

      <!-- Content Wrapper -->
      <div class="content-wrapper">
        <section class="content-header">
          <div class="container-fluid">
            <div class="row mb-2">
              <div class="col-sm-6">
                <h1>Danh sách sinh viên</h1>
              </div>
              <div class="col-sm-6 text-right">
                <a href="/students/create" class="btn btn-success">
                  <i class="fas fa-plus"></i> Thêm mới sinh viên
                </a>
              </div>
            </div>
          </div>
        </section>

        <!-- Main Content -->
        <section class="content">
          <div class="container-fluid">
            <div class="card card-primary card-outline">
              <div class="card-header">
                <!-- Form Tìm kiếm -->
                <form th:action="@{/students}" method="get" class="form-inline">
                  <div class="input-group">
                    <input
                      type="text"
                      name="keyword"
                      th:value="${keyword}"
                      class="form-control"
                      placeholder="Tìm theo tên, mã SV, lớp..."
                    />
                    <div class="input-group-append">
                      <button type="submit" class="btn btn-default">
                        <i class="fas fa-search"></i> Tìm kiếm
                      </button>
                    </div>
                  </div>
                </form>
              </div>

              <div class="card-body table-responsive p-0">
                <table class="table table-hover table-striped text-nowrap">
                  <thead>
                    <tr>
                      <th>Mã SV</th>
                      <th>Họ và Tên</th>
                      <th>Email</th>
                      <th>Số điện thoại</th>
                      <th>Lớp</th>
                      <th class="text-center">Thao tác</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr th:each="student : ${students}">
                      <td th:text="${student.studentCode}"></td>
                      <td th:text="${student.fullName}"></td>
                      <td th:text="${student.email}"></td>
                      <td th:text="${student.phone}"></td>
                      <td th:text="${student.className}"></td>
                      <td class="text-center">
                        <a
                          th:href="@{'/students/edit/' + ${student.id}}"
                          class="btn btn-sm btn-info"
                        >
                          <i class="fas fa-edit"></i> Sửa
                        </a>
                        <form
                          th:action="@{'/students/delete/' + ${student.id}}"
                          method="post"
                          style="display: inline"
                        >
                          <button
                            type="submit"
                            class="btn btn-sm btn-danger"
                            onclick="
                              return confirm(
                                'Bạn có chắc chắn muốn xóa sinh viên này?',
                              );
                            "
                          >
                            <i class="fas fa-trash"></i> Xóa
                          </button>
                        </form>
                      </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(students)}">
                      <td colspan="6" class="text-center text-muted">
                        Không có sinh viên nào.
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </section>
      </div>

      <footer class="main-footer text-center">
        <strong>Hệ thống Quản lý Đào tạo</strong>
      </footer>
    </div>

    <!-- AdminLTE v3 JS & Dependencies qua CDN -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/js/adminlte.min.js"></script>
  </body>
</html>
