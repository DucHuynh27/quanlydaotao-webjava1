<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quản lý Sinh viên</title>
    <!-- Google Fonts -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap"
    />
    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <!-- AdminLTE 4 -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/admin-lte@4.0.0-beta2/dist/css/adminlte.min.css"
    />
    <style>
      body,
      *:not(i):not([class*="bi"]) {
        font-family: "Montserrat", sans-serif !important;
      }
    </style>
  </head>
  <body class="layout-fixed sidebar-expand-lg bg-body-tertiary">
    <div class="app-wrapper">
      <!-- Navbar -->
      <nav class="app-header navbar navbar-expand bg-body">
        <div class="container-fluid">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link" data-lte-toggle="sidebar" href="#" role="button">
                <i class="bi bi-list"></i>
              </a>
            </li>
          </ul>
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <span class="nav-link fw-semibold">Hệ thống Quản lý Đào tạo</span>
            </li>
          </ul>
        </div>
      </nav>

      <!-- Sidebar -->
      <aside class="app-sidebar bg-body-secondary shadow" data-bs-theme="dark">
        <div class="sidebar-brand">
          <a href="student.html" class="brand-link">
            <span class="brand-text fw-bold">QL ĐÀO TẠO</span>
          </a>
        </div>
        <div class="sidebar-wrapper">
          <nav class="mt-2">
            <ul class="nav sidebar-menu flex-column" data-lte-toggle="treeview" role="menu">
              <li class="nav-item">
                <a href="student.html" class="nav-link active">
                  <i class="nav-icon bi bi-mortarboard-fill"></i>
                  <p>Quản lý sinh viên</p>
                </a>
              </li>
            </ul>
          </nav>
        </div>
      </aside>

      <!-- Main -->
      <main class="app-main">
        <div class="app-content-header">
          <div class="container-fluid">
            <div class="row">
              <div class="col-sm-6">
                <h3 class="mb-0">Danh sách sinh viên</h3>
              </div>
              <div class="col-sm-6 text-end">
                <button class="btn btn-success" onclick="openModal('create')">
                  <i class="bi bi-plus-lg"></i> Thêm mới
                </button>
              </div>
            </div>
          </div>
        </div>

        <div class="app-content">
          <div class="container-fluid">
            <div class="card card-outline card-primary">
              <div class="card-header">
                <!-- Tìm kiếm -->
                <div class="input-group" style="max-width: 400px">
                  <input
                    type="text"
                    id="searchInput"
                    class="form-control"
                    placeholder="Tìm theo tên, mã SV, lớp..."
                    oninput="onSearch()"
                  />
                  <span class="input-group-text"><i class="bi bi-search"></i></span>
                </div>
              </div>
              <div class="card-body table-responsive p-0">
                <table class="table table-hover table-striped align-middle mb-0">
                  <thead class="table-light">
                    <tr>
                      <th style="width: 15%">Mã SV</th>
                      <th style="width: 22%">Họ và tên</th>
                      <th style="width: 23%">Email</th>
                      <th style="width: 15%">Số điện thoại</th>
                      <th style="width: 10%">Lớp</th>
                      <th style="width: 15%" class="text-center">Hành động</th>
                    </tr>
                  </thead>
                  <tbody id="studentTableBody">
                    <tr>
                      <td colspan="6" class="text-center py-4 text-muted">
                        Đang tải dữ liệu...
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </main>

      <footer class="app-footer text-center">
        <strong>Hệ thống Quản lý Đào tạo</strong>
      </footer>
    </div>

    <!-- Modal Thêm / Sửa -->
    <div class="modal fade" id="studentModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="modalTitle">Thêm sinh viên</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="studentId" />
            <div class="mb-3">
              <label class="form-label fw-semibold">Mã sinh viên</label>
              <input type="text" id="studentCode" class="form-control" placeholder="VD: SV001" />
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Họ và tên</label>
              <input type="text" id="fullName" class="form-control" placeholder="VD: Nguyễn Văn A" />
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Email</label>
              <input type="email" id="email" class="form-control" placeholder="VD: a@email.com" />
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Số điện thoại</label>
              <input type="text" id="phone" class="form-control" placeholder="VD: 0901234567" />
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Lớp</label>
              <input type="text" id="className" class="form-control" placeholder="VD: CNTT01" />
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
            <button type="button" class="btn btn-primary" onclick="saveStudent()">
              <i class="bi bi-floppy"></i> Lưu
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Modal Xem chi tiết -->
    <div class="modal fade" id="viewModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Chi tiết sinh viên</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <table class="table table-borderless mb-0">
              <tbody>
                <tr><th style="width:40%">Mã sinh viên</th><td id="view-code"></td></tr>
                <tr><th>Họ và tên</th><td id="view-name"></td></tr>
                <tr><th>Email</th><td id="view-email"></td></tr>
                <tr><th>Số điện thoại</th><td id="view-phone"></td></tr>
                <tr><th>Lớp</th><td id="view-class"></td></tr>
              </tbody>
            </table>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/admin-lte@4.0.0-beta2/dist/js/adminlte.min.js"></script>
    <script src="/assets/js/student.js"></script>
  </body>
</html>
